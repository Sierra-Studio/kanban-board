services:
  api:
    build:
      context: ./api
    # Single source of truth for all API config.
    env_file:
      - ./api/.env
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').getcode()==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
      args:
        # Browser-facing API URL (inlined into the client bundle at build time).
        NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:8000}"
        # Internal URL used for SSR/middleware calls between containers.
        INTERNAL_API_URL: "http://api:8000"
    environment:
      NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:8000}"
      INTERNAL_API_URL: "http://api:8000"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
