[project]
name = "kanban-api"
version = "0.1.0"
description = "Kanban Board API — FastAPI + SQLAlchemy + Alembic + SQLite"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",
]

[project.scripts]
kanban-seed = "app.seeding.seed:main"

[tool.setuptools.packages.find]
include = ["app*"]
